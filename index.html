<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Product Showcase</title>
<style>
body { font-family: sans-serif; margin: 40px; line-height: 1.6; color: #333; }
header { border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 40px; }
h1 { margin: 0; color: #111; }
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
.product-card { border: 1px solid #ddd; padding: 15px; border-radius: 4px; }
</style>
</head>
<body>
<header>
<h1>ABIHA LIBAS</h1>
</header>
<main>
<div class="product-grid">
<div class="product-card">
<h2>Product Name</h2>
<p>Brief description of the item goes here.</p>
<p><strong>Price: &inr;10.00</strong></p>
</div>
</div>
</main>
</body>
</html>
